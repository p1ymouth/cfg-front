<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>配置仓库 - 多级目录</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 30px auto; padding: 20px; }
        .breadcrumb { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .breadcrumb a { text-decoration: none; color: #0366d6; margin-right: 5px; cursor: pointer; }
        .file-list { list-style: none; padding-left: 0; }
        .file-list li { padding: 8px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .file-list li:hover { background: #f9f9f9; }
        .icon { margin-right: 12px; font-size: 18px; width: 24px; text-align: center; }
        .dir { cursor: pointer; color: #0366d6; font-weight: 500; }
        .file { cursor: pointer; color: #333; }
        .file:hover { text-decoration: underline; }
        .footer { margin-top: 40px; font-size: 12px; color: #666; text-align: center; }
        /* 模态框 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 20px; width: 80%; max-width: 900px; border-radius: 8px; }
        .close { color: #aaa; float: right; font-size: 28px; cursor: pointer; }
        .preview-content { max-height: 500px; overflow: auto; background: #f5f5f5; padding: 10px; border-radius: 4px; }
        .preview-content pre { margin: 0; white-space: pre-wrap; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 8px 16px; background: #0366d6; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📁 配置文件仓库</h1>
    <div class="breadcrumb" id="breadcrumb"></div>
    <ul class="file-list" id="file-list">加载中...</ul>
    <div class="footer">点击文件夹进入，点击文件预览 | 预览框内可下载</div>

    <div id="previewModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div><strong id="preview-filename"></strong></div>
            <div id="preview-body" class="preview-content">加载中...</div>
            <button id="download-from-modal" class="download-btn">下载此文件</button>
        </div>
    </div>

    <script>
        // 配置
        const GITHUB_USER = 'p1ymouth';
        const REPO_NAME = 'cfg-front';
        const BRANCH = 'main';
        const BASE_RAW = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/`;

        let allFiles = [];          // 存储所有文件的 {path, name, size}
        let currentPath = 'cfgs';   // 当前浏览的目录（相对于仓库根目录）
        let currentFileItem = null;

        // 辅助函数
        function getParentPath(path) {
            const lastSlash = path.lastIndexOf('/');
            if (lastSlash === -1) return '';
            return path.substring(0, lastSlash);
        }

        // 获取当前目录下的直接子文件和子目录
        function getChildren(dirPath) {
            const children = { dirs: new Set(), files: [] };
            for (const file of allFiles) {
                if (file.path.startsWith(dirPath + '/') && file.path !== dirPath) {
                    const relative = file.path.substring(dirPath.length + 1);
                    const firstSlash = relative.indexOf('/');
                    if (firstSlash === -1) {
                        // 直接文件
                        children.files.push(file);
                    } else {
                        // 子目录
                        const subDir = relative.substring(0, firstSlash);
                        children.dirs.add(subDir);
                    }
                }
            }
            // 将目录转换为数组并排序
            const dirList = Array.from(children.dirs).sort();
            return { dirs: dirList, files: children.files.sort((a,b) => a.name.localeCompare(b.name)) };
        }

        // 渲染当前目录
        function renderCurrentDir() {
            const { dirs, files } = getChildren(currentPath);
            const listDiv = document.getElementById('file-list');
            if (dirs.length === 0 && files.length === 0) {
                listDiv.innerHTML = '<li>此文件夹为空</li>';
            } else {
                listDiv.innerHTML = '';
                // 先渲染目录
                for (const dir of dirs) {
                    const li = document.createElement('li');
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'icon';
                    iconSpan.textContent = '📁';
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = dir;
                    nameSpan.className = 'dir';
                    nameSpan.style.cursor = 'pointer';
                    nameSpan.addEventListener('click', () => {
                        currentPath = `${currentPath}/${dir}`;
                        updateURLAndRender();
                    });
                    li.appendChild(iconSpan);
                    li.appendChild(nameSpan);
                    listDiv.appendChild(li);
                }
                // 再渲染文件
                for (const file of files) {
                    const li = document.createElement('li');
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'icon';
                    iconSpan.textContent = '📄';
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = file.name;
                    nameSpan.className = 'file';
                    nameSpan.style.cursor = 'pointer';
                    nameSpan.addEventListener('click', () => previewFile(file));
                    li.appendChild(iconSpan);
                    li.appendChild(nameSpan);
                    listDiv.appendChild(li);
                }
            }
            updateBreadcrumb();
        }

        function updateBreadcrumb() {
            const breadDiv = document.getElementById('breadcrumb');
            if (!currentPath || currentPath === 'cfgs') {
                breadDiv.innerHTML = '<a href="#" data-path="cfgs">根目录</a>';
                const link = breadDiv.querySelector('a');
                if (link) link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPath = 'cfgs';
                    updateURLAndRender();
                });
                return;
            }
            let parts = currentPath.substring(5).split('/'); // 去掉 "cfgs/" 前缀
            let cumulative = 'cfgs';
            let html = '<a href="#" data-path="cfgs">根目录</a> / ';
            parts.forEach((part, idx) => {
                cumulative += '/' + part;
                if (idx === parts.length - 1) {
                    html += `<span>${part}</span>`;
                } else {
                    html += `<a href="#" data-path="${cumulative}">${part}</a> / `;
                }
            });
            breadDiv.innerHTML = html;
            document.querySelectorAll('#breadcrumb a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPath = link.getAttribute('data-path');
                    updateURLAndRender();
                });
            });
        }

        function updateURLAndRender() {
            // 更新 URL hash，但不触发页面刷新
            window.location.hash = currentPath === 'cfgs' ? '' : currentPath;
            renderCurrentDir();
        }

        // 预览文件
        async function previewFile(item) {
            currentFileItem = item;
            document.getElementById('preview-filename').innerText = item.name;
            const previewBody = document.getElementById('preview-body');
            previewBody.innerHTML = '正在加载...';
            document.getElementById('previewModal').style.display = 'block';

            const rawUrl = BASE_RAW + item.path;
            try {
                const resp = await fetch(rawUrl);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                previewBody.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
            } catch (err) {
                previewBody.innerHTML = `<div style="color:red">无法加载: ${err.message}</div>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // 加载 files.json
        async function loadFileList() {
            try {
                const resp = await fetch('files.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                allFiles = await resp.json();
                // 确保 files.json 是数组且每个元素有 path
                if (!Array.isArray(allFiles)) throw new Error('Invalid files.json');
                // 过滤出 cfgs 目录下的文件（防止根目录其他文件混入）
                allFiles = allFiles.filter(f => f.path.startsWith('cfgs/'));
                // 从 hash 中读取初始目录
                const hash = window.location.hash.slice(1);
                if (hash && hash.startsWith('cfgs/')) {
                    currentPath = hash;
                } else {
                    currentPath = 'cfgs';
                }
                renderCurrentDir();
            } catch (err) {
                document.getElementById('file-list').innerHTML = `<li>加载失败: ${err.message}<br>请确保 Action 已生成 files.json</li>`;
            }
        }

        // 模态框事件
        const modal = document.getElementById('previewModal');
        document.querySelector('.close').onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
        document.getElementById('download-from-modal').onclick = () => {
            if (currentFileItem) {
                const rawUrl = BASE_RAW + currentFileItem.path;
                const a = document.createElement('a');
                a.href = rawUrl;
                a.download = currentFileItem.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        };

        // 启动
        loadFileList();
    </script>
</body>
</html>
