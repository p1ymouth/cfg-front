name: Update files list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate files.json from cfgs directory (recursive)
        run: |
          if [ ! -d "cfgs" ]; then
            echo '[]' > files.json
            exit 0
          fi
          echo '[' > files.json
          # 递归查找所有文件
          find cfgs -type f | sort | while read -r file; do
            # 转义路径中的双引号
            safe_path=$(printf "%s" "$file" | sed 's/"/\\"/g')
            name=$(basename "$file")
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
            echo "{\"path\":\"$safe_path\",\"name\":\"$name\",\"size\":$size},"
          done | sed '$ s/,$//' >> files.json
          echo ']' >> files.json

      - name: Commit and push files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add files.json
          git commit -m "Update files.json" || echo "No changes to commit"
          git push
