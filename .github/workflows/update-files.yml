name: Update files list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch and filter cfgs directory
        run: |
          curl -s "https://api.github.com/repos/${{ github.repository }}/contents/cfgs" \
            | jq '[.[] | select(.type == "file") | {path: .path, name: .name, size: .size}]' \
            > files.json

      - name: Commit and push files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add files.json
          git commit -m "Update files.json" || echo "No changes to commit"
          git push
